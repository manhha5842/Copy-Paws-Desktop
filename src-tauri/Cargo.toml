[package]
name = "copypaws"
version = "0.1.0"
description = "CopyPaws - Seamless clipboard synchronization across devices"
authors = ["CopyPaws Team"]
edition = "2021"
license = "MIT"
repository = "https://github.com/yourusername/copypaws-desktop"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "clipboard_hub_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "devtools"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Async runtime
tokio = { version = "1.42", features = ["full"] }
tokio-tungstenite = "0.24"
futures-util = "0.3"

# WebSocket
tungstenite = "0.24"

# Database
rusqlite = { version = "0.32", features = ["bundled"] }

# Encryption
aes-gcm = "0.10"
rand = "0.8"
sha2 = "0.10"

# Clipboard monitoring
arboard = "3.4"

# QR Code generation
qrcode = { version = "0.14", features = ["svg"] }
image = "0.25"

# mDNS service discovery
mdns-sd = "0.11"

# Utilities
uuid = { version = "1.11", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
thiserror = "2.0"
base64 = "0.22"
hostname = "0.4"
urlencoding = "2.1"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-autostart = "2.5.1"
enigo = "0.6.1"
tauri-plugin-positioner = "2.3.1"


